[project]
name = "deep-research-agent"
version = "0.1.0"
description = "A research agent that deduplicates sources, reports disagreement instead of resolving it, and verifies every quote."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# The core is dependency-free. A real search and fetch backend is injected.
dependencies = []

[project.optional-dependencies]
web = ["httpx>=0.28"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# so `pytest` works in a fresh clone, with nothing installed
pythonpath = ["src"]
testpaths = ["tests"]
